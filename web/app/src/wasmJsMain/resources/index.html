<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParrotMetric</title>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-256.png">
<meta name="theme-color" content="#1a201f">
<style>
  html, body { margin: 0; height: 100%; background: #1a201f; overflow: hidden; }
  /* The core draws the model on #pm-gl; the app's screen is over it and leaves it showing. */
  #pm-gl { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; display: block; }
  #root { position: relative; z-index: 2; width: 100%; height: 100%; }
  #status { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center;
            justify-content: center; gap: 10px; padding: 16px; color: #a9b3ad; font: 15px/1.5 system-ui, sans-serif;
            text-align: center; }
  #status img { width: 96px; height: 96px; border-radius: 22px; }
</style>
</head>
<body>
<canvas id="pm-gl"></canvas>
<div id="status"><img src="icons/icon-256.png" alt=""><div id="status-text">Loading ParrotMetric…</div></div>
<div id="root"></div>
<script src="parrotmetric-core.js"></script>
<script>
  // The core first (WebAssembly, about twenty megabytes), then the app, which
  // finds it at globalThis.pmCore.
  createParrotMetricCore().then((core) => {
    globalThis.pmCore = core;
    const app = document.createElement('script');
    app.src = 'parrotmetric-ui.js';
    app.onload = () => document.getElementById('status').remove();
    document.body.appendChild(app);
  }).catch((e) => {
    document.getElementById('status-text').textContent = 'ParrotMetric couldn’t start in this browser: ' + e;
  });
</script>
</body>
</html>
